
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Skills Progress Bars</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="hero">
        <h1>My Skills</h1>
        <p>My technical skills and proficiency levels</p>
    </header>

    <main>
        <section class="skills-section" id="skills">
            <h2>Technical Skills</h2>
            <p class="section-description">
                A visual overview of my programming and web development skills.
            </p>

            <div class="skill">
                <div class="skill-info">
                    <span>HTML5</span>
                    <span>90%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" data-progress="90"></div>
                </div>
            </div>

            <div class="skill">
                <div class="skill-info">
                    <span>CSS3</span>
                    <span>80%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" data-progress="80"></div>
                </div>
            </div>

            <div class="skill">
                <div class="skill-info">
                    <span>JavaScript</span>
                    <span>75%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" data-progress="75"></div>
                </div>
            </div>

            <div class="skill">
                <div class="skill-info">
                    <span>Python</span>
                    <span>70%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" data-progress="70"></div>
                </div>
            </div>

            <div class="skill">
                <div class="skill-info">
                    <span>Java</span>
                    <span>65%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" data-progress="65"></div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Created with HTML, CSS and JavaScript</p>
    </footer>

</body>
</html>
